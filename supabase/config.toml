project_id = "udbvtigwvhvxszimqlgj"

# Directory sync function. Invoked by pg_cron via pg_net with an X-Sync-Secret header,
# so JWT verification is disabled and auth is enforced by the shared secret in code.
[functions.sync-directory]
enabled = true
verify_jwt = false

# Profile ingestion function. Same trigger pattern (pg_cron + pg_net + X-Sync-Secret).
[functions.sync-profiles]
enabled = true
verify_jwt = false

# Lead notification. Fired by an AFTER INSERT trigger on `leads` via pg_net with the
# shared X-Sync-Secret header, so JWT verification is disabled (auth enforced in code).
[functions.notify-lead]
enabled = true
verify_jwt = false
